<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8eeee">
  <title>答案狼人杀</title>
  <style>
    :root {
      --ink: #684f55;
      --muted: #96777e;
      --rose: #b8818d;
      --rose-deep: #96636e;
      --line: rgba(151, 103, 113, .24);
      --paper: rgba(255, 253, 252, .70);
      --shadow: 0 12px 34px rgba(111, 72, 80, .14);
    }

    * { box-sizing: border-box; }
    html { background: #eee4e4; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #eee4e4;
      font-family: "Microsoft JhengHei", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      width: min(100%, 430px);
      min-height: 100svh;
      margin: 0 auto;
      background: #faf6f5;
      box-shadow: 0 0 48px rgba(71, 45, 51, .13);
    }
    .poster {
      position: relative;
      width: 100%;
      min-height: 765px;
      padding: 214px 16px 28px;
      overflow: hidden;
      isolation: isolate;
      background: #fbf6f5 url("assets/background.png") top center / 100% 100% no-repeat;
    }
    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.01), rgba(255,255,255,.08));
    }
    .brand-logo {
      position: absolute;
      top: 10px;
      left: 7px;
      width: 178px;
      height: auto;
      filter: drop-shadow(0 5px 9px rgba(105, 74, 79, .10));
      user-select: none;
      pointer-events: none;
    }
    .title {
      position: absolute;
      top: 78px;
      left: 184px;
      right: 12px;
      margin: 0;
      color: #8f626b;
      font-family: "Microsoft JhengHei", "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: clamp(29px, 8.8vw, 38px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .04em;
      text-align: center;
      text-shadow: 0 2px 8px rgba(145, 96, 107, .12);
      white-space: nowrap;
    }
    .title-mark {
      position: absolute;
      top: 124px;
      right: 30px;
      width: 132px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167,112,123,.65), transparent);
    }
    .title-mark::after {
      content: "✦";
      position: absolute;
      top: -7px;
      left: 57px;
      padding: 0 5px;
      color: #b88690;
      background: rgba(255,248,247,.76);
      font-size: 10px;
    }
    .question-box {
      position: absolute;
      top: 143px;
      left: 18px;
      right: 18px;
      min-height: 54px;
      padding: 9px 12px;
      border: 1px solid rgba(169, 119, 129, .20);
      border-radius: 13px;
      background: rgba(255, 252, 251, .54);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .question-label {
      display: block;
      margin-bottom: 3px;
      color: #8b6970;
      font-size: 10px;
      letter-spacing: .12em;
    }
    .question-input {
      display: block;
      width: 100%;
      height: 26px;
      padding: 0;
      resize: none;
      overflow: hidden;
      border: 0;
      outline: 0;
      color: #6d5157;
      background: transparent;
      font-size: 6px;
      font-weight: 400;
      line-height: 1.35;
      scrollbar-width: none;
    }
    .question-input::-webkit-scrollbar { display: none; }
    .question-input::placeholder { color: rgba(111, 80, 87, .43); }

    .groups { display: grid; gap: 14px; }
    .group-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 17px;
      background: var(--paper);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(177, 128, 138, .10);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .group-label {
      display: flex;
      align-items: center;
      height: 35px;
      padding: 0 13px;
      border-bottom: 1px solid var(--line);
      color: #806168;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .13em;
    }
    .group-label::before {
      content: "";
      width: 4px;
      height: 13px;
      margin-right: 8px;
      border-radius: 6px;
      background: #d4a6ae;
      box-shadow: 0 0 0 3px rgba(212,166,174,.14);
    }
    .answer-grid { display: grid; grid-template-columns: 1fr; }
    .answer-cell {
      position: relative;
      height: 58px;
      padding: 6px 10px 6px 99px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.08);
    }
    .answer-cell:last-child { border-bottom: 0; }
    .name {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 89px;
      display: grid;
      place-items: center;
      border-right: 1px solid rgba(151,103,113,.18);
      color: #795b62;
      background: rgba(241, 223, 222, .25);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .06em;
    }
    .answer-input {
      width: 100%;
      height: 100%;
      padding: 3px 2px;
      resize: none;
      overflow: hidden;
      border: 0;
      outline: 0;
      color: #65484f;
      background: transparent;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.34;
      text-align: center;
      word-break: break-all;
    }
    .answer-input:focus { background: rgba(255,247,246,.58); }
    .answer-input::placeholder { color: rgba(126,91,99,.30); font-size: 10px; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 15px 16px calc(18px + env(safe-area-inset-bottom));
      background: #faf6f5;
    }
    .button {
      min-height: 46px;
      padding: 0 10px;
      border: 1px solid rgba(147,97,108,.23);
      border-radius: 13px;
      cursor: pointer;
      color: #785960;
      background: #fffafa;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: .04em;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .button:active { transform: scale(.98); }
    .button.primary {
      border-color: transparent;
      color: #fff;
      background: #a87882;
      box-shadow: 0 7px 17px rgba(130,86,96,.21);
    }
    .button.wide { grid-column: 1 / -1; }
    .button:disabled { cursor: wait; opacity: .62; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 20;
      max-width: calc(100vw - 40px);
      padding: 9px 15px;
      border-radius: 999px;
      color: #fff;
      background: rgba(78,56,61,.91);
      box-shadow: 0 8px 22px rgba(54,33,38,.18);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 359px) {
      .poster { padding-inline: 11px; }
      .brand-logo { width: 162px; }
      .title { left: 160px; font-size: 31px; }
      .question-box { left: 13px; right: 13px; }
      .answer-cell { padding-left: 92px; }
      .name { width: 83px; }
    }
    @media (min-width: 431px) {
      body { padding: 20px 0; }
      .app-shell { border-radius: 23px; overflow: hidden; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="poster" id="poster" aria-label="答案狼人杀记录表">
      <img class="brand-logo" src="assets/logo.png" alt="DM梦时标志">
      <h1 class="title">答案狼人杀</h1>
      <span class="title-mark" aria-hidden="true"></span>

      <label class="question-box" for="questionInput">
        <span class="question-label">题目</span>
        <textarea class="question-input" id="questionInput" placeholder="点击填写题目，内容会完整保留"></textarea>
      </label>

      <div class="groups" id="groups"></div>
    </section>
    <section class="controls" aria-label="操作区">
      <button class="button" id="shuffleBtn" type="button">打乱名字</button>
      <button class="button" id="clearBtn" type="button">清空内容</button>
      <button class="button primary" id="exportBtn" type="button">导出图片</button>
      <button class="button primary" id="exportHiddenBtn" type="button">隐藏名字并导出</button>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const DEFAULT_GROUPS = [
      { key: "boys", label: "男生角色", names: ["顾星辰", "江叙白", "秋亦帆", "林泽宇"] },
      { key: "girls", label: "女生角色", names: ["苏晚晴", "夏知柚", "许星眠", "温以宁"] }
    ];
    const STORAGE_KEY = "answer-werewolf-sheet-v1";
    const groupsEl = document.getElementById("groups");
    const questionInput = document.getElementById("questionInput");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");
    const exportHiddenBtn = document.getElementById("exportHiddenBtn");
    const toastEl = document.getElementById("toast");
    let toastTimer;

    const makeDefaultState = () => ({
      question: "",
      orders: Object.fromEntries(DEFAULT_GROUPS.map(group => [group.key, [...group.names]])),
      answers: {}
    });

    let state = loadState();

    function loadState() {
      const fallback = makeDefaultState();
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved) return fallback;
        DEFAULT_GROUPS.forEach(group => {
          const order = saved.orders?.[group.key];
          const valid = Array.isArray(order) && order.length === group.names.length &&
            group.names.every(name => order.includes(name));
          if (!valid) saved.orders = { ...(saved.orders || {}), [group.key]: [...group.names] };
        });
        return {
          question: typeof saved.question === "string" ? saved.question : "",
          orders: saved.orders,
          answers: saved.answers && typeof saved.answers === "object" ? saved.answers : {}
        };
      } catch (_) {
        return fallback;
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (_) { showToast("当前浏览器无法保存内容"); }
    }

    function renderGroups() {
      groupsEl.innerHTML = DEFAULT_GROUPS.map(group => `
        <article class="group-card">
          <div class="group-label">${group.label}</div>
          <div class="answer-grid">
            ${state.orders[group.key].map(name => `
              <label class="answer-cell">
                <span class="name">${name}</span>
                <textarea class="answer-input" data-name="${name}" aria-label="${name}的答案" placeholder="填写答案">${escapeHtml(state.answers[name] || "")}</textarea>
              </label>
            `).join("")}
          </div>
        </article>
      `).join("");
      document.querySelectorAll(".answer-input").forEach(fitAnswerText);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fitAnswerText(input) {
      let size = 13;
      input.style.fontSize = `${size}px`;
      while ((input.scrollHeight > input.clientHeight + 1 || input.scrollWidth > input.clientWidth + 1) && size > 7) {
        size -= .5;
        input.style.fontSize = `${size}px`;
      }
    }

    function fitQuestionText() {
      let size = 6;
      questionInput.style.fontSize = `${size}px`;
      while (questionInput.scrollHeight > questionInput.clientHeight + 1 && size > 3) {
        size -= .25;
        questionInput.style.fontSize = `${size}px`;
      }
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function shuffleNames() {
      DEFAULT_GROUPS.forEach(group => {
        const previous = state.orders[group.key];
        let next = shuffle(previous);
        if (next.every((name, index) => name === previous[index])) {
          next = [...next.slice(1), next[0]];
        }
        state.orders[group.key] = next;
      });
      saveState();
      renderGroups();
      showToast("名字顺序已打乱");
    }

    function clearAll() {
      if (!window.confirm("确定清空题目和全部答案吗？")) return;
      state = makeDefaultState();
      questionInput.value = "";
      saveState();
      renderGroups();
      showToast("内容已清空");
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("show");
      toastTimer = window.setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function setCanvasFont(ctx, size, family = "sans", weight = 400) {
      const families = family === "hand"
        ? '"STKaiti", "KaiTi", "Kaiti SC", cursive'
        : '"Microsoft JhengHei", "Noto Sans SC", "Microsoft YaHei", sans-serif';
      ctx.font = `${weight} ${size}px ${families}`;
    }

    function drawCenteredText(ctx, text, x, y, size, color, family = "sans") {
      ctx.save();
      setCanvasFont(ctx, size, family, 400);
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(text), x, y);
      ctx.restore();
    }

    function wrapText(ctx, text, maxWidth) {
      const paragraphs = String(text || "").split("\n");
      const lines = [];
      paragraphs.forEach(paragraph => {
        if (!paragraph) { lines.push(""); return; }
        let line = "";
        Array.from(paragraph).forEach(character => {
          const test = line + character;
          if (line && ctx.measureText(test).width > maxWidth) {
            lines.push(line);
            line = character;
          } else {
            line = test;
          }
        });
        lines.push(line);
      });
      return lines;
    }

    function fittedLines(ctx, text, maxWidth, maxHeight, startSize, minSize, lineRatio = 1.3) {
      let size = startSize;
      let lines = [];
      while (size >= minSize) {
        setCanvasFont(ctx, size);
        lines = wrapText(ctx, text, maxWidth);
        if (lines.length * size * lineRatio <= maxHeight) break;
        size -= 1;
      }
      return { size: Math.max(size, minSize), lines, lineHeight: Math.max(size, minSize) * lineRatio };
    }

    function drawWrappedCentered(ctx, text, x, y, width, height, startSize, minSize, color) {
      if (!text) return;
      const fitted = fittedLines(ctx, text, width, height, startSize, minSize);
      ctx.save();
      setCanvasFont(ctx, fitted.size);
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const total = fitted.lines.length * fitted.lineHeight;
      fitted.lines.forEach((line, index) => {
        ctx.fillText(line, x, y - total / 2 + fitted.lineHeight * (index + .5));
      });
      ctx.restore();
    }

    function drawQuestion(ctx) {
      const x = 45, y = 355, width = 990, height = 132;
      roundedRect(ctx, x, y, width, height, 31);
      ctx.fillStyle = "rgba(255, 252, 251, .73)";
      ctx.fill();
      ctx.strokeStyle = "rgba(169, 119, 129, .24)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      setCanvasFont(ctx, 24);
      ctx.fillStyle = "#8b6970";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("题目", x + 29, y + 30);
      ctx.restore();

      const content = fittedLines(ctx, state.question, width - 58, 70, 15, 6, 1.28);
      ctx.save();
      setCanvasFont(ctx, content.size);
      ctx.fillStyle = "#6d5157";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const startY = y + 51 + Math.max(0, (70 - content.lines.length * content.lineHeight) / 2);
      content.lines.forEach((line, index) => {
        ctx.fillText(line, x + 29, startY + index * content.lineHeight);
      });
      ctx.restore();
    }

    function drawGroup(ctx, group, y, hideNames) {
      const x = 40, width = 1000, labelHeight = 78, rowHeight = 104, nameWidth = 220;
      const height = labelHeight + rowHeight * 4;

      ctx.save();
      ctx.shadowColor = "rgba(103, 69, 77, .16)";
      ctx.shadowBlur = 32;
      ctx.shadowOffsetY = 12;
      roundedRect(ctx, x, y, width, height, 35);
      ctx.fillStyle = "rgba(255, 253, 252, .80)";
      ctx.fill();
      ctx.restore();

      ctx.save();
      roundedRect(ctx, x, y, width, height, 35);
      ctx.clip();
      ctx.fillStyle = "rgba(242, 224, 224, .31)";
      ctx.fillRect(x, y + labelHeight, nameWidth, height - labelHeight);
      ctx.strokeStyle = "rgba(151, 103, 113, .27)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + labelHeight);
      ctx.lineTo(x + width, y + labelHeight);
      for (let row = 1; row < 4; row += 1) {
        ctx.moveTo(x, y + labelHeight + rowHeight * row);
        ctx.lineTo(x + width, y + labelHeight + rowHeight * row);
      }
      ctx.moveTo(x + nameWidth, y + labelHeight);
      ctx.lineTo(x + nameWidth, y + height);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      roundedRect(ctx, x, y, width, height, 35);
      ctx.strokeStyle = "rgba(176, 131, 140, .28)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      roundedRect(ctx, x + 27, y + 25, 9, 29, 7);
      ctx.fillStyle = "#d4a6ae";
      ctx.fill();
      ctx.save();
      setCanvasFont(ctx, 28);
      ctx.fillStyle = "#806168";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(group.label, x + 55, y + labelHeight / 2);
      ctx.restore();

      state.orders[group.key].forEach((name, index) => {
        const cellY = y + labelHeight + index * rowHeight;
        if (!hideNames) {
          drawCenteredText(ctx, name, x + nameWidth / 2, cellY + rowHeight / 2, 28, "#795b62");
        }
        drawWrappedCentered(
          ctx,
          state.answers[name] || "",
          x + nameWidth + (width - nameWidth) / 2,
          cellY + rowHeight / 2,
          width - nameWidth - 46,
          rowHeight - 22,
          29,
          7,
          "#65484f"
        );
      });
    }

    async function exportImage(hideNames = false) {
      const button = hideNames ? exportHiddenBtn : exportBtn;
      const original = button.textContent;
      button.disabled = true;
      button.textContent = "正在生成…";
      try {
        const [background, logo] = await Promise.all([
          loadImage("assets/background.png"),
          loadImage("assets/logo.png")
        ]);
        if (document.fonts?.ready) await document.fonts.ready;
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1920;
        const ctx = canvas.getContext("2d");

        ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(logo, 17, 21, 455, 256);
        drawCenteredText(ctx, "答案狼人杀", 765, 211, 83, "#8f626b");
        ctx.strokeStyle = "rgba(167,112,123,.58)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(712, 291);
        ctx.lineTo(1015, 291);
        ctx.stroke();
        drawCenteredText(ctx, "✦", 864, 291, 22, "#b88690");

        drawQuestion(ctx);
        drawGroup(ctx, DEFAULT_GROUPS[0], 528, hideNames);
        drawGroup(ctx, DEFAULT_GROUPS[1], 1050, hideNames);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("无法生成图片");
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = hideNames ? "答案狼人杀-隐藏名字.png" : "答案狼人杀.png";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
        showToast(hideNames ? "隐藏名字图片已导出" : "图片已导出");
      } catch (error) {
        showToast("导出失败，请重试");
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    }

    questionInput.value = state.question;
    fitQuestionText();
    renderGroups();

    questionInput.addEventListener("input", () => {
      state.question = questionInput.value;
      fitQuestionText();
      saveState();
    });
    groupsEl.addEventListener("input", event => {
      if (!event.target.matches(".answer-input")) return;
      state.answers[event.target.dataset.name] = event.target.value;
      fitAnswerText(event.target);
      saveState();
    });
    shuffleBtn.addEventListener("click", shuffleNames);
    clearBtn.addEventListener("click", clearAll);
    exportBtn.addEventListener("click", () => exportImage(false));
    exportHiddenBtn.addEventListener("click", () => exportImage(true));
  </script>
</body>
</html>
